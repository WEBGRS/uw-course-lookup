name = "uw-course-api"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOW_ORIGINS = "https://webgrs.github.io"

# Request log, sessions and blocklist shared with the other WEBGRS sites; secrets: SESSION_KEY, ADMIN_TOKEN, TURNSTILE_SECRET
[[d1_databases]]
binding = "DB"
database_name = "webgrs-guard"
database_id = "56acd46c-739c-440a-acb2-8818a2f2bad5"

[triggers]
crons = ["23 9 * * *"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# The in-page assistant (Workers AI; the free daily allowance applies)
[ai]
binding = "AI"

# Per-location limits on top of the page's own request volume
[[ratelimits]]
name = "RL_LIST"
namespace_id = "1001"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "RL_DETAIL"
namespace_id = "1002"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RL_CHAT"
namespace_id = "1003"
[ratelimits.simple]
limit = 30
period = 60
