name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the program scraper's dependencies
        run: pip install -r requirements.txt
      - name: Pipeline unit tests (database tests skip when the private data is absent)
        run: python -m unittest discover -s tests -v
      - name: API tests
        run: cd worker && node --test "test/*.test.mjs"
      - name: No private data in the repo
        run: |
          for f in courses.json worker/data.json data/uwcourses.db assets/data.js; do
            if [ -e "$f" ]; then echo "private file committed: $f"; exit 1; fi
          done
