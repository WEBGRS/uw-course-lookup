name: Refresh data
# Rebuilds sections, grades and insights from the public APIs and commits the result.
# Manual by default; uncomment the schedule to refresh every Monday.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 12 * * 1"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild
        run: python scripts/pipeline.py --refresh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/uwcourses.db data/insights.json data/rejected_codes.json docs/ANALYSIS.md assets index.html
          git diff --cached --quiet || git commit -m "Refresh course data"
          git push
